<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Toolkit Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Password Toolkit Pro</h2>

    <div class="top-bar">
        <button id="themeToggle" data-tooltip="Dark Mode">🌙</button>
        <button id="voiceBtn" data-tooltip="Voice Input">🎤</button>
        <button id="historyBtn" data-tooltip="Password History">📜</button>
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="Enter or generate password">
        <button id="toggleBtn">Show</button>
    </div>

    <div class="buttons">
        <button id="analyzeBtn">Analyze</button>
        <button id="generateBtn">Generate</button>
        <button id="copyBtn">Copy</button>
    </div>

    <div class="strength-meter">
        <div id="strength-bar"></div>
    </div>

    <p id="strength-text">Strength: None</p>
    <p id="score-text">Score: 0%</p>

    <div class="suggestions">
        <h4>Suggestions:</h4>
        <ul id="suggestion-list"></ul>
    </div>
</div>

<!-- Sidebar History -->
<div id="historyPanel" class="history-panel">
    <div class="history-header">
        <h3>Password History</h3>
        <button id="closeHistory">✖</button>
    </div>
    <button id="clearHistory">Clear History</button>
    <ul id="history-list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
